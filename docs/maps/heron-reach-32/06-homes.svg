<path d="M1369.2,561.32 L1416.35,561.32" fill="none" stroke="#a0b5bc" stroke-width="0.8" /><path d="M1428.65,561.32 L1475.8,561.32" fill="none" stroke="#a0b5bc" stroke-width="0.8" /><text x="1422.5" y="646.6" font-size="12" fill="#eeeade" text-anchor="middle" font-weight="600">DN</text><path d="M1115,313 L1484,313" fill="none" stroke="#a0b5bc" stroke-width="1" /><text x="1299.5" y="303" font-size="16" fill="#eeeade" text-anchor="middle" font-weight="400">9.00 m</text><text x="1102" y="499" font-size="13" fill="#a0b5bc" text-anchor="end" font-weight="400">8 m</text><path d="M1330.25,345 L1330.25,653" fill="none" stroke="#62d2da" stroke-width="2" stroke-dasharray="6 4" /><text x="1330.25" y="504.74" font-size="11" fill="#eeeade" text-anchor="middle" font-weight="600">HALL</text><text x="1240.05" y="453.9" font-size="11" fill="#eeeade" text-anchor="middle" font-weight="600">BEDROOM 1</text><text x="1240.05" y="642.5" font-size="11" fill="#eeeade" text-anchor="middle" font-weight="600">BEDROOM 2</text><text x="1422.5" y="381.74" font-size="11" fill="#eeeade" text-anchor="middle" font-weight="600">BATH</text><text x="1422.5" y="545.74" font-size="11" fill="#eeeade" text-anchor="middle" font-weight="600">STAIR VOID</text><text x="1115" y="720" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Two bedrooms, bathroom and a</text><text x="1115" y="745" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">separate hall. Exit to the rear</text><text x="1115" y="770" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">landing; bedrooms never need to</text><text x="1115" y="795" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">become the public circulation</text><text x="1115" y="820" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">route.</text><text x="1115" y="850" font-size="15" fill="#62d2da" text-anchor="start" font-weight="700">72 m² gross per storey / 144 m² total</text><rect x="65" y=