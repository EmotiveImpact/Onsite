"1084" y="245" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">A LONDON ESTATE, NOT AN ARENA BOX</text><text x="1084" y="278" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Wet stock brick, warm entrances, planted</text><text x="1084" y="302" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">edges and linked concrete galleries. Three</text><text x="1084" y="326" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">places to recognise; multiple paths between</text><text x="1084" y="350" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">them.</text><text x="1084" y="410" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">LAYERED PLAY</text><text x="1084" y="443" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">-3 m undercroft / 0 m street / +3 m</text><text x="1084" y="467" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">galleries / +6 m maisonettes / +9 m two</text><text x="1084" y="491" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">roofs. Eight stair cores and sixteen</text><text x="1084" y="515" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">enterable homes.</text><text x="1084" y="575" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">SNEAK WITHOUT GETTING LOST</text><text x="1084" y="608" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Through flats, private stairs, covered</text><text x="1084" y="632" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">arcades and a service loop reconnect to</text><text x="1084" y="656" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">familiar landmarks. No compulsory crawl</text><text x="1084" y="680" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">tunnels or dead-end routes.</text><text x="1084" y="740" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">BUILDABLE NEXT STEP</text><text x="1084" y="773" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">One metric definition drives every sheet</text><text x="1084" y="797" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">and the separate Blender massing model.</text><text x="1084" y="821" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">This is a proposal for blockout and</text><text x="1084" y="845" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">32-player testing, not proof of balance.</text><rect x="80" y="1061" width="18" height="13" rx="0" fill="#534b43" stroke="none" stroke-width="1" /><text x="107" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Homes</text><rect x="186" y="1061" width="18" height="13" rx="0" fill="#62d2da" stroke="none" stroke-width="1" /><text x="213" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Public / flank route</text><rect x="412" y="1061" width="18" height="13" rx="0" fill="#b18a57" stroke="none" stroke-width="1" /><text x="439" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Tall cover</text><rect x="558" y="1061" width="18" height="13" rx="0" fill="#304b3d" stroke="none" stroke-width="1" /><text x="585" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Planting</text><rect x="688" y="1061" width="18" height="13" rx="0" fill="#e9af54" stroke="none" stroke-width="1" /><text x="715" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Capture area</text><path d="M80,1100 L236,1100" fill="none" stroke="#eeeade" stroke-width="3" /><path d="M80,1095 L80,1105" fill="none" stroke="#eeeade" stroke-width="2" /><path d="M236,1095 L236,1105" fill="none" stroke="#eeeade" stroke-width="2" /><text x="80" y="1123" font-size="12" fill="#a0b5bc" text-anchor="start" font-weight="400">0</text><text x="236" y="1123" font ="#eeeade" text-anchor="start" font-weight="400">position has another approach.</text><text x="1084" y="716" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">NO INVISIBLE FLOORS</text><text x="1084" y="749" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">The centre is open to the court below. Only</text><text x="1084" y="773" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">coloured surfaces and stair landings have a</text><text x="1084" y="797" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">proposed walking floor.</text><rect x="80" y="1061" width="18" height="13" rx="0" fill="#534b43" stroke="none" stroke-width="1" /><text x="107" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Homes / enclosed</text><rect x="274" y="1061" width="18" height="13" rx="0" fill="#62d2da" stroke="none" stroke-width="1" /><text x="301" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Gallery / routes</text><rect x="468" y="1061" width="18" height="13" rx="0" fill="#e9af54" stroke="none" stroke-width="1" /><text x="495" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Stair / objective</text><rect x="670" y="1061" width="18" height="13" rx="0" fill="#243038" stroke="none" stroke-width="1" /><text x="697" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Scenery only</text><path d="M80,1100 L236,1100" fill="none" stroke="#eeeade" stroke-width="3" /><path d="M80,1095 L80,1105" fill="none" stroke="#eeeade" stroke-width="2" /><path d="M236,1095 L236,1105" fill="none" stroke="#eeeade" stroke-width="2" /><text x="80" y="1123" font-size="12" fill="#a0b5bc" text-anchor="start" font-weight="400">0</text><text x="236" y="1123" font-size="12" fill="#a0b5bc" text-anchor="end" font-weight="400">24 m</text></g></svg></article><article data-page="3" ><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200 m: S2, S3, S6, S7.</text><text x="1084" y="386" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">SLOWER, HIDDEN CHOICE</text><text x="1084" y="419" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">A dogleg middle cross-link adds options. No</text><text x="1084" y="443" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">dead-end spawn room or one-way drop. Warm</text><text x="1084" y="467" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">exit markers contrast with cool service</text><text x="1084" y="491" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">lighting.</text><text x="1084" y="551" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">SOUND IS THE TRADEOFF</text><text x="1084" y="584" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Grilles, concrete and metal doors give</text><text x="1084" y="608" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">clear footsteps. Stealth comes from broken</text><text x="1084" y="632" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">sightlines and timing, not blacked-out</text><text x="1084" y="656" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">character visibility.</text><text x="1084" y="716" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">DESIGN GRAPH ONLY</text><text x="1084" y="749" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">The linework proves planned connections.</text><text x="1084" y="773" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Headroom, support columns, wall offsets and</text><text x="1084" y="797" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">actual Rapier traversal must be validated</text><text x="1084" y="821" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">in the blockout.</text><rect x="80" y="1061" width="18" height="13" rx="0" fill="#534b43" stroke="none" stroke-width="1" /><text x="107" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Homes / enclosed</text><rect x="274" y="1061" width="18" height="13" rx="0" fill="#62d2da" stroke="none" stroke-width="1" /><text x="301" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Gallery / routes</text><rect x="468" y="1061" width="18" height="13" rx="0" fill="#e9af54" stroke="none" stroke-width="1" /><text x="495" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Stair / objective</text><rect x="670" y="1061" width="18" height="13" rx="0" fill="#243038" stroke="none" stroke-width="1" /><text x="697" y="1073" font-size="14" fill="#a0b5bc" text-anchor="start" font-weight="400">Scenery only</text><path d="M80,1100 L236,1100" fill="none" stroke="#eeeade" stroke-width="3" /><path d="M80,1095 L80,1105" fill="none" stroke="#eeeade" stroke-width="2" /><path d="M236,1095 L236,1105" fill="none" stroke="#eeeade" stroke-width="2" /><text x="80" y="1123" font-size="12" fill="#a0b5bc" text-anchor="start" font-weight="400">0</text><text x="236" y="1123" font-size="12" fill="#a0b5bc" text-anchor="end" font-weight="400">24 m</text></g></svg></article><article data-page="6" ><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="HOME DESIGNS"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8L8,0" stroke="#75808a" stroke-width="1" opacity=".3"/></pattern><radialGradient id="lamp"><stop offset="0" stop-color="#ffc675" stop-opacity=".48"/><stop offset="1" stop-color="#ffc675" stop-opacity="0"/></radialGradient></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1600" height="1200" rx="0" fill="#10191f" stroke="none" stroke-width="1" /><text x="64" y="70" font-size="42" fill="#eeeade" text-anchor="start" font-weight="800">ONSITE</text><text x="64" y= asured lux or runtime light</text><text x="1084" y="374" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">counts.</text><text x="1084" y="434" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">PLANTING HAS STRUCTURE</text><text x="1084" y="467" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">20 tree positions: trunks collide, canopies</text><text x="1084" y="491" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">start at 2.7 m. Ten grass/soil zones;</text><text x="1084" y="515" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">shrubs below 0.7 m by main routes. Leaves</text><text x="1084" y="539" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">provide visual texture, not dependable</text><text x="1084" y="563" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">ballistic cover.</text><text x="1084" y="623" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">DIRT BELONGS SOMEWHERE</text><text x="1084" y="656" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Litter at shopfronts and bin bays; moss at</text><text x="1084" y="680" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">shaded slab joints; soil under planting;</text><text x="1084" y="704" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">puddles at drains and low edges. Keep</text><text x="1084" y="728" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">steps, doorway swings and cover gaps clear.</text><text x="1084" y="788" font-size="19" fill="#e9af54" text-anchor="start" font-weight="700">SIX BASE MATERIAL FAMILIES</text><text x="1084" y="821" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">Stock brick, board concrete, asphalt,</text><text x="1084" y="845" font-size="16" fill="#eeeade" text-anchor="start" font-weight="400">paving, painted steel and soil/grass. Share</text><t
